<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas Afetivas</title>
    <link rel="stylesheet" href="estilos/estilo.css">
</head>

<body>

    <nav class="menu" id="menu">
        <a title="Voltar para a página inicial!" href="index.html">Início</a>
        <a title="Explore as nossas deliciosas receitas!" href="receitas.html">Receitas</a>
        <a title="Compartilhe conosco a sua receita!" href="envie.html">Envie sua receita</a>
        <a title="Mantenha-se sempre atualizado!" href="cadastro.html">Cadastre-se</a>
    </nav>

    <div class="conteudo">

        <h1 class="titulo01">Cadastro</h1>

        <p class="texto01">Cadastre-se aqui para ficar por dentro de todas as nossas novidades e receitas!</p>

        <form class="texto03" action="sucesso.html" method="get" target="_blank">
            <fieldset>
                <legend>Preencha com seus dados</legend>

                <label for="pnome">Nome:</label>
                <input type="text" id="pnome" name="pnome" value="">

                <label for="snome">Sobrenome:</label>
                <input type="text" id="snome" name="snome" value=""><br>

                <label for="data"> Data de nascimento:</label>
                <input type="date" id="data" name="data">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"> <br>

                <p>Comentários e observações:</p>

                <textarea name="obs" rows="15" cols="50"> </textarea><br>

                <p>Eu gostaria de receber:</p>

                <label><input type="checkbox" id="noticias" name="noticias" value="noticias">
                    Notícias</label>

                <label><input type="checkbox" id="receitas" name="receitas" value="receitas">
                    Novas receitas</label>
                    
                <br><br>

                <input type="submit" value="Enviar">

            </fieldset>

        </form>

        <br><br><br>

        <img class="image01" src="imagens/imagenini.png" alt="Receitas Afetivas Decoração">

        <br><br><br><br><br>

        <a class="topo" href="#menu"> Voltar ao topo</a>

    </div>
