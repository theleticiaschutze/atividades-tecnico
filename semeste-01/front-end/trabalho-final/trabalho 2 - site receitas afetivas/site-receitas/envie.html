<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envie sua receita!</title>
    <link rel="stylesheet" href="estilos/estilo.css">
</head>

<body>

    <nav class="menu" id="menu">
      <a title="Voltar para a página inicial!" href="index.html">Início</a>
      <a title="Explore as nossas deliciosas receitas!" href="receitas.html">Receitas</a>      
      <a title="Compartilhe conosco a sua receita!" href="envie.html">Envie sua receita</a>
      <a title="Mantenha-se sempre atualizado!" href="cadastro.html">Cadastre-se</a>
    </nav>

    <div class="conteudo">

        <h1 class="titulo01">Envie sua receita</h1>

        <p class="texto01">Compartilhe conosco as suas receitas afetivas!</p>

        <form class="texto03" action="sucesso.html" method="get" target="_blank" enctype="multipart/form-data">
            <fieldset>
                <legend>Preencha com detalhes</legend>

                <label for="pnome">Seu nome:</label>
                <input type="text" id="pnome" name="pnome" value="">

                <label for="snome">Autor da receita:</label>
                <input type="text" id="rcnome" name="rcnome" value=""><br>

                <label for="recnome">Título da receita</label>
                <input type="text" id="recnome" name="recnome" value="">

                <label for="image">Envie uma imagem:</label>
                <input type="file" id="foto" name="foto" accept="image/*">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"> <br>

                <p>Ingredientes:</p>

                <textarea name="obs" rows="15" cols="50"> </textarea><br>

                <p>Modo de preparo:</p>

                <textarea name="obs" rows="15" cols="50"> </textarea><br>

                <p>Comentários e observações:</p>

                <textarea name="obs" rows="15" cols="50"> </textarea><br>

                <label for="nivel">Nível de dificuldade:</label>
                <select id="nivel" name="nivel">
                    <option value="facil">Fácil</option>
                    <option value="medio">Mediano</option>
                    <option value="dificil">Avançado</option>
                </select>

                <br><br>

                <input type="submit" value="Enviar">

            </fieldset>

        </form>

        <br><br><br>

        <img class="image01" src="imagens/imagenini.png" alt="Receitas Afetivas Decoração">

        <br><br><br><br><br>

        <a class="topo" href="#menu"> Voltar ao topo</a>

    </div>






</body>

</html>
